<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Barebones Local Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 10px; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    input, button { padding: 8px; font-size: 14px; }
    #msgInput { width: 60%; }
  </style>
</head>
<body>

  <h2>Local Chat</h2>
  <div id="chat-box"></div>

  <input type="text" id="userInput" placeholder="Your name" /><br><br>
  <input type="text" id="msgInput" placeholder="Type a message..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    function loadMessages() {
      const chatBox = document.getElementById('chat-box');
      const messages = JSON.parse(localStorage.getItem('localChat')) || [];
      chatBox.innerHTML = messages.map(m => `<p><strong>${m.user}:</strong> ${m.text}</p>`).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const user = document.getElementById('userInput').value.trim() || 'Anonymous';
      const text = document.getElementById('msgInput').value.trim();
      if (!text) return;

      const messages = JSON.parse(localStorage.getItem('localChat')) || [];
      messages.push({ user, text });
      localStorage.setItem('localChat', JSON.stringify(messages));

      document.getElementById('msgInput').value = '';
      loadMessages();
    }

    // Load messages when page opens
    loadMessages();
  </script>

</body>
</html>
